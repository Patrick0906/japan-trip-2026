    function cleanLocationName(line) {
        let cleaned = line.replace(/^•\s*/, '').replace(/^(朝食|昼食|夕食|午餐|晚餐)：/, '').trim();
        cleaned = cleaned.replace(/[\[【].*?[\]】]/g, '').replace(/[\(（].*?[\)）]/g, '');
        cleaned = cleaned.replace(/\d{1,2}:\d{2}(?:\s*[-〜~]\s*\d{1,2}:\d{2})?/g, '');
        cleaned = cleaned.replace(/[\d,]+円/g, '').replace(/^タクシー\s*→\s*/, '');
        return cleaned.replace(/\s+/g, ' ').trim();
    }

    function isLocationLine(line) {
        const trimmed = line.trim();
        if (trimmed.length < 2) return false;
        if (customLinks[trimmed]) return true;
        if (/^.+?\s+\d{1,2}:\d{2}\s*[-〜~]\s*.+?\s+\d{1,2}:\d{2}/.test(trimmed)) return true;
        
        // 包含您要求的關鍵字過濾
        const excludeKeywords = ['飯店', '朝食', '昼食', '夕食', '午餐', '晚餐', '車站', '泡湯', '花火', '喝酒', 'Note:', 'Action:', 'Info:', 'Lounge', 'LOUNGE', 'ANA LOUNGE', 'Gate', '貴賓室', 'チェックイン', 'チェックアウト', 'ホテル', '機內食', '晩酌', '搭乘手續き', '手荷物預け', '海産食品ハマ達', '八百屋GOHAN', '源ちゃん', 'ナギ的大樹', '速玉宮', '結宮', 'ゴトビキ岩', '買い物', '急行', 'エクスプレス', '鉄道一般', 'シャトル', '円', '一畑', '弘南', '御坊', '環状', 'くろしお', '内回り'];
        if (excludeKeywords.some(k => trimmed.includes(k))) return false;

        if (trimmed.startsWith('※') || trimmed.startsWith('【')) return false;
        if (trimmed === '未定') return false;
        if ((trimmed.includes('→') || trimmed.includes('▶')) && !trimmed.startsWith('タクシー') && /\d{1,2}:\d{2}/.test(trimmed)) return false;
        if (trimmed.includes(' - ') && /\d{1,2}:\d/.test(trimmed) && !trimmed.includes('津輕')) return false;
        if (trimmed.includes('⇒')) return false;

        const keywords = ['店', '駅', '空港', '神社', 'ホテル', '館', '公園', '溫泉', '山', '寺', '居酒屋', '食堂', '珈琲', '壽司', '燒肉', '庵', '軒', '屋', '苑', '亭', '茶寮', '市場', '美術館', '處', '宿', 'イン', 'INN', '福乃和', 'Brewing', 'il filo', 'ローソン', 'バスターミナル', '園', '天ぷら', '惣菜', '坂', '跡', '參道', '塔', '滝', '大社', 'ターミナル', '宮', 'ユニクロ', 'BEAMS', '商店', '梅むら', 'HATAGO', '秀吉'];
        
        if (line.startsWith('•') || line.startsWith('  ') || keywords.some(k => line.includes(k))) return true;
        if (/^[A-Z][a-zA-Z\s.,]+$/.test(trimmed) && trimmed.length > 3) return true;
        
        return false;
    }

    function parseItinerary(day) {
        const rawLines = [
            ...(day.morning ? day.morning.split('\n') : []),
            ...(day.afternoon ? day.afternoon.split('\n') : []),
            ...(day.evening ? day.evening.split('\n') : [])
        ];
        const items = [];
        let currentItem = null;

        const commitCurrentItem = () => { if (currentItem) { items.push(currentItem); currentItem = null; } };

        for (let line of rawLines) {
            line = line.trim();
            if (!line || line.match(/^-+$/) || line === '行程：') continue;

            if (line.match(/^(朝食|昼食|夕食|午餐|晚餐)：/)) {
                commitCurrentItem();
                const parts = line.split('：');
                currentItem = { type: 'meal', title: parts[0], content: parts[1] || '', details: [], raw: line };
                continue;
            }
            if (line.match(/(?:BR|JL|NH|MM|IT|CI|GK|UO|OZ)\d+/) || (line.includes('-') && (line.includes('HND') || line.includes('NRT') || line.includes('ITM') || line.includes('KHH') || line.includes('AOJ') || line.includes('IZO') || line.includes('TTJ') || line.includes('ICN')))) {
                commitCurrentItem();
                currentItem = { type: 'flight', content: line, details: [], raw: line };
                continue;
            }
            const arrowCount = (line.match(/[→▶]/g) || []).length;
            const isTimetable = /^.+?\s+\d{1,2}:\d{2}\s*[-〜~]\s*.+?\s+\d{1,2}:\d{2}/.test(line);
            
            if (((line.includes('→') || line.includes('▶')) && !line.trim().startsWith('[') && !line.includes('參拜の順') && arrowCount === 1) || isTimetable) {
                if (currentItem && currentItem.type === 'transport' && currentItem.details.length === 0) {
                    currentItem.content += '\n' + line;
                    continue;
                }
                commitCurrentItem();
                currentItem = { type: 'transport', content: line, details: [], raw: line };
                continue;
            }
            if (line.startsWith('•')) {
                commitCurrentItem();
                currentItem = { type: 'spot', content: line.replace(/^•\s*/, ''), details: [], raw: line };
                continue;
            }
            if (currentItem) { currentItem.details.push(line); } 
            else { items.push({ type: 'note', content: line, details: [], raw: line }); }
        }
        commitCurrentItem();
        
        const mealTypes = [{ key: 'breakfast', aliases: ['朝食', 'Breakfast', '早餐'] }, { key: 'lunch', aliases: ['昼食', 'Lunch', '午餐'] }, { key: 'dinner', aliases: ['夕食', 'Dinner', '晚餐'] }];
        mealTypes.forEach(type => {
            const mealItemIndex = items.findIndex(item => item.type === 'meal' && type.aliases.some(alias => item.title && item.title.includes(alias)));
            if (mealItemIndex === -1) return;
            const mealItem = items[mealItemIndex];
            const candidateIndex = items.findIndex((item, idx) => {
                if (idx === mealItemIndex) return false;
                if (item.type !== 'spot' && item.type !== 'transport') return false;
                if (type.aliases.some(alias => item.content.includes(alias))) return true;
                return false;
            });
            if (candidateIndex !== -1) {
                items.splice(mealItemIndex, 1);
                let targetIndex = mealItemIndex < candidateIndex ? candidateIndex - 1 : candidateIndex;
                items.splice(targetIndex + 1, 0, mealItem);
            }
        });
        return items;
    }

    function renderTextWithLinks(text, forceLinks = false) {
        if (!text) return '';
        const lines = text.split('\n');
        return lines.map(line => {

            const timeMatch = trimmed.match(/^(\d{1,2}:\d{2}(?:\s*[-〜~]\s*\d{1,2}:\d{2})?)\s+(.*)$/);

            if (timeMatch) { displayTime = timeMatch[1]; displayLocation = timeMatch[2]; }

            if (forceLinks || isLocationLine(displayLocation)) {

            }
            return `<div class="text-sumi leading-relaxed whitespace-pre-wrap pl-1 border-l-2 border-transparent">${trimmed}</div>`;

    }

    function renderTransportItem(item) {
        // 1. 判斷是否為巴士 (包含之前修正的關鍵字)
        const busKeywords = ['Bus', 'バス', '空港線', 'くにびき', '交通', 'コミュニティ', 'くる梨', '系統', 'イエロー'];
        const isBus = item.details?.some(d => busKeywords.some(k => d.includes(k))) || 
                      item.content.includes('Bus') || 
                      item.content.includes('バス') ||

        const isLogistic = logisticKeywords.some(keyword => item.content.includes(keyword));
        
        let iconHtml = isBoat ? `<div class="mt-1.5 shrink-0 w-7 h-7 flex items-center justify-center z-10 bg-cyan-50 border border-cyan-200 rounded-full"><i data-lucide="ship" class="text-cyan-600" width="14" height="14"></i></div>` : `<div class="mt-1.5 shrink-0 w-7 h-7 flex items-center justify-center z-10"><div class="w-2 h-2 rounded-full ${isLogistic ? 'bg-stone-400' : 'bg-accent-red'} ring-4 ring-washi group-hover:scale-110 transition-transform shadow-[0_0_0_2px_#F7F5F0]"></div></div>`;
        
        const isPlainText = !isLocationLine(item.raw || item.content);
        
        const timeMatch = item.content.match(/^(\d{1,2}:\d{2}(?:\s*[-〜~]\s*\d{1,2}:\d{2})?)\s+(.*)$/);
        let displayTime = null, displayContent = item.content;
        if (timeMatch) { displayTime = timeMatch[1]; displayContent = timeMatch[2]; }
        
        let targetUrl = '#';
        if (!isPlainText) {
            // 先嘗試直接查表
            if (customLinks[displayContent]) {
                targetUrl = customLinks[displayContent];
            } else {
                // 查不到才去清洗名稱並搜尋地圖
                targetUrl = getMapLink(cleanLocationName(displayContent));
            }
        }

        let contentHtml = isPlainText ? 
            `<div class="text-sumi font-serif text-sm font-medium leading-relaxed">${displayContent}</div>` : 
            `<a href="${targetUrl}" target="_blank" class="text-sumi font-serif text-sm font-medium leading-relaxed group-hover/link:text-accent-red transition-colors decoration-accent-red/30 underline-offset-4 group-hover/link:underline">${displayContent}</a>`;
        
        let suggestionHtml = '';
        const mealKey = item.content.includes('朝食') ? '朝食' : (item.content.includes('昼食') ? '昼食' : (item.content.includes('夕食') ? '夕食' : null));
        if (item.content.includes('未定') && mealKey && MEAL_SUGGESTIONS[dayLabel]?.[mealKey]) {
            suggestionHtml = `<div class="mt-3 pt-3 border-t border-dashed border-stone-200"><div class="text-[10px] text-sumi-light/60 mb-1 flex items-center gap-1"><i data-lucide="sparkles" class="text-accent-gold" width="10" height="10"></i><span>おすすめスポット</span></div>${renderTextWithLinks(MEAL_SUGGESTIONS[dayLabel][mealKey], true)}</div>`;
        }
        let detailsHtml = item.details.length > 0 ? `<div class="mt-1 text-sm text-sumi-light font-serif pl-0 border-l-2 border-stone-200 pl-3 ml-1 py-1 space-y-1">${renderTextWithLinks(item.details.join('\n'))}</div>` : '';
        return `<div class="flex gap-4 group items-start">${iconHtml}<div class="flex-1 block ${!isPlainText ? 'group/link' : ''}"><div class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-2">${displayTime ? `<span class="text-xs font-sans text-sumi-light/70 whitespace-nowrap min-w-[3.5rem] pt-0.5">${displayTime}</span>` : ''}${contentHtml}</div>${suggestionHtml}${detailsHtml}</div></div>`;
    }
        
// --- 天氣功能與快取 (優化版：LocalStorage + 過期機制) ---
    const WEATHER_CACHE_KEY = 'trip_weather_data_v2';
    const CACHE_EXPIRY_MS = 60 * 60 * 1000; // 快取有效時間：1小時

    function getLocalWeatherCache() {
        try {
            return JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)) || {};
        } catch (e) {
            return {};
        }
    }

    function saveLocalWeatherCache(data) {
        localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(data));
    }

    // 支援同時處理多個城市
    async function fetchWeather(cities) {
        const localCache = getLocalWeatherCache();
        const now = Date.now();
        let hasCacheUpdate = false;

        // 使用 Promise.all 讓多個城市的請求「同時」發出，而不是一個接一個
        const promises = cities.map(async city => {
            const el = document.getElementById(`weather-data-${city}`);
            if (!el) return;

            const coords = CITY_COORDINATES[city];
            if (!coords) {
                el.innerHTML = '<span class="text-[9px] text-stone-300">-</span>';
                return;
            }

            const cachedItem = localCache[city];
            let shouldFetch = true;

            // 1. 策略：如果有快取，無論是否過期，先「瞬間顯示」給使用者看 (提升體感速度)
            if (cachedItem) {
                updateWeatherUI(el, cachedItem);
                // 如果快取還很新鮮 (在1小時內)，就不重新抓取
                if (now - cachedItem.timestamp < CACHE_EXPIRY_MS) {
                    shouldFetch = false;
                }
            }

            // 2. 如果沒有快取，或者快取過期了，就去背景抓新的
            if (shouldFetch) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,weather_code&timezone=auto`);
                    if (!res.ok) throw new Error('API Fail');
                    const data = await res.json();

                    const weatherInfo = {
                        temp: Math.round(data.current.temperature_2m),
                        code: data.current.weather_code,
                        timestamp: now // 紀錄抓取時間
                    };

                    // 更新畫面 (如果原本是舊快取，這裡會更新成新的)
                    updateWeatherUI(el, weatherInfo);
                    
                    // 更新快取物件
                    localCache[city] = weatherInfo;
                    hasCacheUpdate = true;

                } catch (e) {
                    console.error(`Weather error for ${city}:`, e);
                    // 如果抓取失敗但沒有快取，顯示 N/A
                    if (!cachedItem) {
                        el.innerHTML = '<span class="text-[9px] text-stone-300">N/A</span>';
                    }
                }
            }
        });

        // 等待所有請求完成後，如果有更新才寫入 LocalStorage (減少寫入次數)
        await Promise.all(promises);
        if (hasCacheUpdate) {
            saveLocalWeatherCache(localCache);
        }
    }

    function updateWeatherUI(el, info) {
        // 使用 innerHTML 替換內容
        el.innerHTML = `
            ${getWeatherIcon(info.code)} 
            <span class="text-lg font-bold font-sans text-sumi-light animate-fade-in">${info.temp}°</span>
        `;
        // 重要：因為是用 innerHTML 插入的 icon，必須重新觸發 Lucide 渲染
        if (window.lucide) {
            window.lucide.createIcons({ root: el });
        }
    }

    function updateWeatherUI(el, info) {
        el.innerHTML = `
            ${getWeatherIcon(info.code)} 
            <span class="text-lg font-bold font-sans text-sumi-light">${info.temp}°</span>
        `;
        if (window.lucide) {
            window.lucide.createIcons({ root: el });
        }
    }
        
    function renderDayCard(dayIndex) {
        const day = TRIP_DATA[dayIndex];
        const container = document.getElementById('main-content');
        const cities = day.route.split(/[\s　]+/).filter(c => CITY_COORDINATES[c]);
        
        // 1. Weather
        let weatherHtml = '';
        if (cities.length > 0) {
             weatherHtml = `<div class="flex gap-2 mb-6" id="weather-container">${cities.map(city => `<button class="flex-1 flex items-center justify-between bg-white/80 p-3 rounded-lg border border-stone-200 shadow-sm transition-transform" id="weather-btn-${city}"><div class="flex flex-col items-start"><span class="text-sm font-serif font-bold text-sumi">${city}</span><span class="text-[10px] text-sumi-light/70 font-sans">Current</span></div><div class="flex items-center gap-2" id="weather-data-${city}"><div class="w-5 h-5 bg-stone-100 rounded animate-pulse"></div></div></button>`).join('')}</div>`;
             setTimeout(() => fetchWeather(cities), 0);
        }
        
        // 2. Notes
        const savedNotes = JSON.parse(localStorage.getItem('trip_notes_v1') || '{}');
        const currentNote = savedNotes[day.date] !== undefined ? savedNotes[day.date] : day.notes;
        const notesHtml = `<div class="bg-[#FFFBEB] p-3 rounded-md border-l-4 border-accent-gold shadow-sm relative overflow-hidden mb-6 group"><div class="absolute -right-2 -top-2 text-accent-gold/10 pointer-events-none"><i data-lucide="info" width="60" height="60"></i></div><div class="flex items-center justify-between mb-1.5 relative z-10"><span class="bg-accent-gold text-white text-[10px] font-bold px-1.5 py-0.5 rounded-sm flex items-center gap-1">旅のメモ</span><i data-lucide="pen-line" width="12" height="12" class="text-accent-gold opacity-50 group-hover:opacity-100 transition-opacity"></i></div><textarea id="day-note-textarea" class="note-textarea relative z-10 text-xs text-stone-700 placeholder-stone-400/50" placeholder="ここにメモを入力してください...">${currentNote}</textarea></div>`;

        // 3. Itinerary
        const itinerary = parseItinerary(day);
        const itineraryHtml = itinerary.map(item => {
            // 修復：三餐卡片與推薦邏輯
            if (item.type === 'meal') {
                const mealKey = item.title;
                let suggestions = null;
                const keyMap = { '早餐': '朝食', '午餐': '昼食', '晚餐': '夕食', 'Breakfast': '朝食', 'Lunch': '昼食', 'Dinner': '夕食' };
                const lookupKey = keyMap[item.title] || item.title;

                if (MEAL_SUGGESTIONS[day.dayLabel]) {
                    if (day.dayLabel === '2/14(土)' && lookupKey === '夕食') {
                        suggestions = MEAL_SUGGESTIONS[day.dayLabel]['dinner_recommendations'] || MEAL_SUGGESTIONS[day.dayLabel]['夕食'];
                    } else {
                        suggestions = MEAL_SUGGESTIONS[day.dayLabel][lookupKey];
                    }
                }

                let suggestionBlock = '';
                if (suggestions) {
                    suggestionBlock = `
                    <div class="mt-3 pt-3 border-t border-dashed border-stone-200">
                        <div class="text-[10px] text-sumi-light/60 mb-1 flex items-center gap-1"><i data-lucide="sparkles" class="text-accent-gold" width="10" height="10"></i><span>${item.content.includes('未定') ? 'おすすめスポット' : 'その他のおすすめ'}</span></div>
                        <div class="text-sm">${renderTextWithLinks(suggestions, true)}</div>
                    </div>`;
                }

                return `
                <div class="flex gap-4 group items-start relative z-10 pl-2 mb-6">
                    <div class="mt-1 shrink-0 w-7 h-7 rounded-full bg-orange-50 border border-orange-200 flex items-center justify-center text-orange-600 z-10 group-hover:border-orange-400 transition-colors shadow-[0_0_0_1px_rgba(255,255,255,1)]">
                        <i data-lucide="utensils" width="14" height="14"></i>
                    </div>
                    <div class="flex-1 bg-white p-4 rounded-sm border border-stone-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] hover:shadow-md transition-shadow">
                        <div class="text-[10px] text-orange-600/80 font-serif tracking-widest uppercase mb-1 border-b border-orange-100/50 pb-1 w-full">${item.title}</div>
                        <div class="text-sumi font-serif text-base leading-relaxed">
                            ${item.title?.includes('朝食') ? `<span>${item.content}</span>` : renderTextWithLinks(item.content)}
                            ${suggestionBlock}
                        </div>
                        ${item.details.length > 0 ? `<div class="mt-2 pt-2 border-t border-stone-100/50 text-sm text-sumi-light font-serif space-y-1">${renderTextWithLinks(item.details.join('\n'))}</div>` : ''}
                    </div>
                </div>`;
            } 
            
            if (item.type === 'flight') return `<div class="relative z-10 pl-2 mb-6">${renderFlightItem(item)}</div>`;
            if (item.type === 'transport') return `<div class="relative z-10 pl-2 mb-6">${renderTransportItem(item)}</div>`;
            if (item.type === 'spot') return `<div class="relative z-10 pl-2 mb-6">${renderSpotItem(item, day.dayLabel)}</div>`;
            return `<div class="relative z-10 pl-2 mb-2"><div class="flex gap-4 opacity-70"><div class="shrink-0 w-7"></div><div class="py-0 text-xs text-sumi-light font-serif italic tracking-wide">${item.content}</div></div></div>`;
        }).join('');

        // 4. Accommodation
        let accHtml = '';
        if (day.accommodation) {
             const lines = day.accommodation.split('\n');
             const hotelName = lines[0];
             const details = lines.slice(1);

             // ★★★ 新增：判斷日期並產生連結 HTML ★★★
             let specialLinkHtml = '';
             if (day.date === '2026年2月12日' || day.date === '2026年2月13日') {
                 specialLinkHtml = `
                 <div class="mt-2 pt-2 border-t border-stone-200/40">
                    <a href="https://www.torican.jp/feature/tottorishi-syukuhakuCP-2" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2 text-xs font-bold text-accent-red hover:text-red-700 transition-colors">
                        <i data-lucide="ticket" width="14" height="14"></i>
                        <span>鳥取市宿泊CP</span>
                    </a>
                 </div>`;
             }

             // 將 specialLinkHtml 插入到最後面
             accHtml = `<div class="pt-8 relative z-10 pl-2 mb-6"><div class="flex gap-4 items-start"><div class="mt-1 shrink-0 w-7 h-7 rounded-full bg-violet-50 border border-violet-200 flex items-center justify-center text-violet-600 z-10 shadow-[0_0_0_1px_rgba(255,255,255,1)]"><i data-lucide="bed" width="14" height="14"></i></div><div class="flex-1 bg-[#F5F4F0] p-5 rounded-sm border border-stone-200 hover:border-violet-200/50 transition-colors"><h3 class="text-[10px] font-serif text-violet-600/70 uppercase tracking-widest mb-2 flex items-center gap-2"><span>Accommodation</span><span class="h-[1px] flex-1 bg-stone-300/50"></span></h3><div class="text-base font-serif text-sumi leading-relaxed">${renderTextWithLinks(hotelName, true)}${details.length > 0 ? `<div class="mt-2 pt-2 border-t border-stone-200/40 text-sm text-sumi-light/90 font-serif space-y-1">${details.map(d => `<div class="flex items-start gap-2 ${d.trim().startsWith('◆') ? 'mt-1' : 'pl-3.5'}">${d.trim().startsWith('◆') ? '<div class="mt-[6px] shrink-0 w-1.5 h-1.5 bg-accent-red/60 rotate-45 border border-accent-red/30"></div>' : ''}<span>${d.replace('◆','').trim()}</span></div>`).join('')}</div>` : ''}${specialLinkHtml}</div></div></div></div>`;
        }

        // 5. Stories & Recs
        let storiesHtml = '';
        if (day.stories || day.recommendations) {
            let recs = day.recommendations ? `<div class="pl-12 mb-6 space-y-4">${day.recommendations.map(rec => `<div class="bg-white/60 p-3 rounded border border-stone-200 shadow-sm backdrop-blur-sm"><div class="flex items-center gap-2 mb-2 text-xs font-serif font-bold tracking-wider"><span class="${rec.type === 'food' ? 'bg-red-50 text-red-700 border-red-100' : 'bg-indigo-50 text-indigo-700 border-indigo-100'} px-2 py-0.5 rounded border flex items-center gap-1"><i data-lucide="${rec.type === 'food' ? 'utensils' : 'shopping-bag'}" width="10" height="10"></i>${rec.title}</span></div><div class="flex flex-wrap gap-2">${rec.items.map(i => `<div class="inline-flex items-baseline gap-1.5 text-sm"><span class="font-serif font-bold text-sumi">${i.name}</span><span class="text-[10px] font-sans text-stone-500 bg-stone-100 px-1 rounded-sm">${i.jpName}</span></div>`).join('')}</div></div>`).join('')}</div>` : '';
            let storyCards = day.stories ? `<div class="pl-12 space-y-4">${day.stories.map(s => `<div class="bg-[#FDFCF8] border border-stone-300/60 p-4 rounded-sm relative overflow-hidden group hover:shadow-sm transition-shadow"><div class="absolute top-0 right-0 w-8 h-8 bg-stone-100 rounded-bl-3xl z-0 transition-transform group-hover:scale-150 duration-500"></div><div class="relative z-10"><div class="mb-3"><h4 class="font-serif font-bold text-sumi flex items-center gap-2"><i data-lucide="book-open" width="14" height="14" class="text-accent-gold"></i><span>${s.title}</span></h4>${s.titleJp ? `<div class="text-xs text-accent-blue/80 font-bold font-sans ml-6 mt-1 tracking-wide leading-tight">${s.titleJp.split('\n').map((l,i) => `<span class="${i===1 ? 'block text-[8px] text-sumi-light/70 font-normal mt-0.5' : ''}">${l}</span>`).join('')}</div>` : ''}</div><div class="space-y-3">${s.contentJp ? `<p class="text-sm text-sumi leading-7 text-justify font-serif border-l-2 border-accent-gold/30 pl-3">${s.contentJp}</p>` : ''}<div class="relative pt-2"><div class="w-4 h-[1px] bg-stone-300 mb-2"></div><p class="text-xs text-sumi-light leading-relaxed text-justify font-sans opacity-90">${s.content}</p></div></div></div></div>`).join('')}</div>` : '';
            storiesHtml = `<div class="pt-6 pl-2 relative z-10"><h3 class="flex items-center gap-3 text-sm font-serif font-bold text-sumi-light mb-4 ml-10 whitespace-nowrap"><span class="w-8 h-[1px] bg-stone-300 shrink-0"></span><span>旅のしおり</span><span class="w-full h-[1px] bg-stone-300"></span></h3>${recs}${storyCards}</div>`;
        }

        container.innerHTML = `<div class="w-full max-w-lg mx-auto pb-32 animate-fade-in px-5">${weatherHtml}${notesHtml}<div class="space-y-6 relative"><div class="absolute left-[15px] top-2 bottom-2 w-[1px] bg-stone-300/50 z-0"></div>${itineraryHtml}</div>${accHtml}${storiesHtml}<div class="mt-16 flex justify-center opacity-20 text-accent-blue"><i data-lucide="snowflake" width="24" height="24"></i></div></div>`;
        
        lucide.createIcons();
        
        // ... 在 renderDayCard 函式最後面 ...

        const textarea = document.getElementById('day-note-textarea');
        if (textarea) {
             const resize = () => { 
                 textarea.style.height = 'auto'; 
                 textarea.style.height = textarea.scrollHeight + 'px'; 
             };
             resize();

             // ★★★ 這裡就是自動加圓點的關鍵邏輯 ★★★
             textarea.addEventListener('keydown', function(e) {
                 if (e.key === 'Enter') {
                     e.preventDefault(); // 1. 阻止預設的單純換行

                     const start = this.selectionStart;
                     const end = this.selectionEnd;
                     
                     // 2. 在游標位置插入 "換行符號 + 圓點 + 空格"
                     const text = this.value;
                     const before = text.substring(0, start);
                     const after = text.substring(end);
                     
                     this.value = before + "\n• " + after;
                     
                     // 3. 將游標移動到圓點之後
                     this.selectionStart = this.selectionEnd = start + 3;

                     // 4. 手動觸發 input 事件，確保高度調整和儲存功能會執行
                     this.dispatchEvent(new Event('input'));
                 }
             });

             // 原有的輸入監聽 (負責自動調整高度與儲存)
             textarea.addEventListener('input', (e) => { 
                 resize(); 
                 const notesMap = JSON.parse(localStorage.getItem('trip_notes_v1') || '{}'); 
                 notesMap[day.date] = e.target.value; 
                 localStorage.setItem('trip_notes_v1', JSON.stringify(notesMap)); 
             });
        }
    } // renderDayCard 結束括號
        
    function init() {
        const navContainer = document.getElementById('date-nav');
        if (!navContainer) return; 
        
        navContainer.innerHTML = '';
        
        if (!TRIP_DATA || TRIP_DATA.length === 0) {
            console.error("TRIP_DATA is empty!");
            return;
        }

        TRIP_DATA.forEach((day, index) => {
            const currentTheme = getCurrentTheme(index);
            const prevTheme = index > 0 ? getCurrentTheme(index - 1) : null;
            
            // 渲染主題標籤
            if (currentTheme !== prevTheme) {
                const themeDiv = document.createElement('div');
                themeDiv.className = "flex-shrink-0 flex items-center justify-center pl-1 pr-3 snap-start h-[4.5rem]";
                themeDiv.innerHTML = `<div class="h-full flex items-center border-l-2 border-stone-300/30 pl-2"><span class="text-[10px] font-serif font-medium text-[#666666] tracking-widest" style="writing-mode: vertical-rl;">${currentTheme}</span></div>`;
                navContainer.appendChild(themeDiv);
            }
            
            // 渲染按鈕 (修復顯示問題)
            const btn = document.createElement('button');
            const isSelected = index === 0;
            const dateParts = day.dayLabel.split('(')[0].split('/');
            const dayNum = dateParts[1] || '?';
            const dayOfWeek = day.dayLabel.match(/\((.)\)/)?.[1] || '';
            
            btn.className = `flex-shrink-0 snap-center flex flex-col items-center justify-center w-14 h-[4.5rem] gap-0.5 rounded-xl transition-all duration-300 border overflow-hidden ${isSelected ? 'bg-stone-500 border-stone-500' : 'bg-white border-stone-100 hover:border-stone-200 shadow-sm'}`;
            btn.setAttribute('data-day-index', index);
            
            btn.innerHTML = `
                <span class="block text-lg font-serif font-bold tracking-wider leading-none ${isSelected ? 'text-[#F7F5F0]' : 'text-[#3E3E3E]'}">${dayNum}</span>
                <span class="block text-[9px] font-serif leading-none ${isSelected ? 'text-[#F7F5F0] opacity-90' : 'text-[#3E3E3E] opacity-50'}">${dayOfWeek}</span>
                <span class="block w-[90%] text-[8px] tracking-tighter font-medium border-t pt-0.5 px-0.5 text-center leading-tight whitespace-nowrap overflow-hidden text-ellipsis ${isSelected ? 'border-white/30 text-[#F7F5F0]' : 'border-stone-100 text-[#666666]'}">${day.route}</span>
            `;
            
            btn.onclick = () => selectDay(index);
            navContainer.appendChild(btn);
        });

        if (typeof renderDayCard === 'function') { renderDayCard(0); }
        if (window.lucide) { window.lucide.createIcons(); }

        const mapBtn = document.getElementById('map-btn');
        if (mapBtn) {
            mapBtn.onclick = () => {
                const day = TRIP_DATA[currentState.selectedDayIndex];
                const query = `${day.route} 日本`;
                const url = getGoogleMapsUrl(query);
                window.open(url, '_blank');
            };
        }
    }

    function selectDay(index) {
        currentState.selectedDayIndex = index;
        const buttons = document.querySelectorAll('#date-nav button');
        
        buttons.forEach(btn => {
            const idx = parseInt(btn.getAttribute('data-day-index'));
            const isSelected = idx === index;
            
            btn.className = `flex-shrink-0 snap-center flex flex-col items-center justify-center w-14 h-[4.5rem] gap-0.5 rounded-xl transition-all duration-300 border overflow-hidden ${isSelected ? 'bg-stone-500 border-stone-500' : 'bg-white border-stone-100 hover:border-stone-200 shadow-sm'}`;
            
            const spans = btn.querySelectorAll('span');
            if (spans.length >= 3) {
                spans[0].className = `block text-lg font-serif font-bold tracking-wider leading-none ${isSelected ? 'text-[#F7F5F0]' : 'text-[#3E3E3E]'}`;
                spans[1].className = `block text-[9px] mb-1 font-serif leading-none ${isSelected ? 'text-[#F7F5F0] opacity-90' : 'text-[#3E3E3E] opacity-50'}`;
                spans[2].className = `block w-[90%] text-[8px] tracking-tighter font-medium border-t pt-0.5 px-0.5 text-center leading-tight whitespace-nowrap overflow-hidden text-ellipsis ${isSelected ? 'border-white/30 text-[#F7F5F0]' : 'border-stone-100 text-[#666666]'}`;
            }

            if (isSelected) {
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
        
        if (typeof renderDayCard === 'function') {
            renderDayCard(index);
        }
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
